# cargo-audit configuration (https://github.com/rustsec/rustsec/tree/main/cargo-audit)
#
# Run from src-tauri/:  cargo audit
#
# Any advisory ignored here must be ACCEPTED, not unnoticed — a transitive
# dependency we cannot bump directly, with a rationale for why it is not
# exploitable in LanBeam. Revisit on every dependency bump: once an upstream
# release drops the offending crate, delete the ignore so the advisory can
# resurface if it ever returns.
#
# Nothing is ignored right now. The last entries (quick-xml 0.39,
# RUSTSEC-2026-0194/0195, pulled only by wayland-scanner for the Linux Wayland
# clipboard) went when wayland-scanner 0.31.11 moved to quick-xml 0.41.
#
# What `cargo audit` still prints are non-failing WARNINGS, all from Tauri's own
# tree, and they clear as Tauri updates:
# - "unmaintained": unic-* (via urlpattern), proc-macro-error (a build-time proc
#   macro), zbus_names / zvariant / zvariant_derive (the Linux D-Bus stack used by
#   notifications and the Secret Service).
# - "unsound": glib 0.18 (RUSTSEC-2024-0429) — the gtk-rs GTK3 stack, compiled for
#   Linux only. The fix is glib 0.20, which has no GTK3 bindings; nothing in
#   LanBeam or its dependencies calls the affected `VariantStrIter`.

[advisories]
ignore = []
